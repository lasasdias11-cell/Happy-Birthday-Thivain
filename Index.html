<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
      user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#08080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Happy Birthday, Thivain 🎂</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    min-height: 100svh;
    min-height: -webkit-fill-available;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 0%,
            #211938 0%,
            #0c0b13 48%,
            #050507 100%
        );

    position: relative;
    isolation: isolate;
}

/* =========================
   BACKGROUND ORBS
========================= */

.ambient {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -2;
}

.orb {
    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    filter: blur(70px);
    -webkit-filter: blur(70px);

    opacity: 0.6;

    will-change: transform;
}

.orb1 {
    left: -80px;
    top: -70px;

    background:
        radial-gradient(
            circle,
            rgba(255, 55, 150, 0.95),
            transparent 70%
        );

    animation:
        move1 9s ease-in-out infinite alternate;
}

.orb2 {
    right: -90px;
    top: 25%;

    background:
        radial-gradient(
            circle,
            rgba(75, 95, 255, 0.95),
            transparent 70%
        );

    animation:
        move2 11s ease-in-out infinite alternate;
}

.orb3 {
    left: 20%;
    bottom: -120px;

    background:
        radial-gradient(
            circle,
            rgba(255, 160, 50, 0.9),
            transparent 70%
        );

    animation:
        move3 12s ease-in-out infinite alternate;
}

@keyframes move1 {
    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(100px, 180px) scale(1.2);
    }
}

@keyframes move2 {
    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(-120px, 80px) scale(1.2);
    }
}

@keyframes move3 {
    from {
        transform: translate(0, 0) scale(0.9);
    }

    to {
        transform: translate(100px, -100px) scale(1.2);
    }
}

.light {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,0.05),
            transparent 60%
        );
}

/* =========================
   CONFETTI
========================= */

#confetti {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 100;
}

/* =========================
   CARD
========================= */

.card {
    width: min(100%, 430px);

    padding:
        clamp(28px, 7vw, 42px)
        clamp(22px, 6vw, 38px)
        clamp(24px, 6vw, 36px);

    border-radius: 32px;

    border:
        1px solid rgba(255,255,255,0.17);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.15),
            rgba(255,255,255,0.055)
        );

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.14);

    text-align: center;

    position: relative;

    overflow: hidden;

    animation:
        appear 700ms cubic-bezier(.16,1,.3,1);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.card::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.1),
            transparent 35%,
            transparent 70%,
            rgba(255,255,255,.04)
        );
}

/* =========================
   TEXT
========================= */

.badge {
    position: relative;
    z-index: 2;

    display: inline-block;

    padding: 8px 14px;
    margin-bottom: 25px;

    border-radius: 999px;

    background: rgba(255,255,255,.075);
    border: 1px solid rgba(255,255,255,.12);

    color: rgba(255,255,255,.7);

    font-size: 10px;
    font-weight: 700;

    letter-spacing: .15em;
    text-transform: uppercase;
}

.emoji {
    position: relative;
    z-index: 2;

    font-size: 62px;

    margin-bottom: 15px;

    display: block;

    animation:
        bounce 2.5s ease-in-out infinite;
}

@keyframes bounce {
    0%,100% {
        transform: translateY(0) rotate(0);
    }

    50% {
        transform: translateY(-8px) rotate(4deg);
    }
}

h1 {
    position: relative;
    z-index: 2;

    font-size: clamp(30px, 8vw, 43px);

    line-height: 1.03;

    letter-spacing: -.045em;

    font-weight: 800;

    margin-bottom: 9px;

    background:
        linear-gradient(
            110deg,
            #fff,
            #ffd8eb,
            #d5dcff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.friend {
    position: relative;
    z-index: 2;

    color: rgba(255,255,255,.55);

    font-size: 14px;

    margin-bottom: 20px;
}

.message {
    position: relative;
    z-index: 2;

    color: rgba(255,255,255,.84);

    font-size: 16px;

    line-height: 1.55;

    margin-bottom: 21px;
}

.message strong {
    color: white;
}

/* =========================
   INSTAGRAM
========================= */

.instagram {
    position: relative;
    z-index: 2;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    padding: 9px 14px;

    margin-bottom: 24px;

    border-radius: 999px;

    color: rgba(255,255,255,.72);

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.11);

    text-decoration: none;

    font-size: 13px;

    font-weight: 600;

    transition: transform .15s ease;
}

.instagram:active {
    transform: scale(.94);
}

.instagram-icon {
    width: 17px;
    height: 17px;

    border: 1.5px solid currentColor;

    border-radius: 5px;

    position: relative;
}

.instagram-icon::before {
    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    border: 1.4px solid currentColor;

    border-radius: 50%;
}

.instagram-icon::after {
    content: "";

    position: absolute;

    width: 3px;
    height: 3px;

    right: 2px;
    top: 2px;

    background: currentColor;

    border-radius: 50%;
}

/* =========================
   BUTTON
========================= */

#celebrate {
    position: relative;
    z-index: 2;

    width: 100%;

    min-height: 58px;

    border: none;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #ffe0ed 50%,
            #dfe3ff
        );

    color: #111118;

    font-family: inherit;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-user-select: none;
    user-select: none;

    box-shadow:
        0 14px 35px rgba(255,255,255,.13),
        inset 0 1px 1px rgba(255,255,255,.9);

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

#celebrate:active {
    transform: scale(.94);

    box-shadow:
        0 6px 18px rgba(255,255,255,.1);
}

#celebrate:focus {
    outline: none;
}

.button-inner {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 9px;
}

.button-emoji {
    font-size: 21px;
}

.footer {
    position: relative;
    z-index: 2;

    margin-top: 14px;

    color: rgba(255,255,255,.35);

    font-size: 10px;

    letter-spacing: .04em;
}

/* =========================
   SMALL SCREENS
========================= */

@media (max-height: 700px) {

    .card {
        padding-top: 20px;
        padding-bottom: 20px;
    }

    .badge {
        margin-bottom: 13px;
    }

    .emoji {
        font-size: 45px;
        margin-bottom: 8px;
    }

    h1 {
        font-size: 30px;
    }

    .friend {
        margin-bottom: 10px;
    }

    .message {
        font-size: 14px;
        margin-bottom: 12px;
    }

    .instagram {
        margin-bottom: 13px;
    }

    #celebrate {
        min-height: 50px;
    }
}
</style>
</head>

<body>

<!-- Background -->
<div class="ambient">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<div class="light"></div>

<!-- Confetti -->
<canvas id="confetti"></canvas>

<!-- Birthday Card -->
<main class="card">

    <div class="badge">
        A little birthday surprise ✨
    </div>

    <span class="emoji">🎂</span>

    <h1>
        Happy Birthday,<br>
        Thivain!
    </h1>

    <p class="friend">
        To an awesome school friend
    </p>

    <p class="message">
        Hope your day is filled with
        <strong>good vibes, big laughs</strong>
        and unforgettable memories. ✨
        <br><br>
        Here's to another amazing year.
        <strong>Keep being you! 🚀</strong>
    </p>

    <a
        class="instagram"
        href="https://www.instagram.com/thivainoax/"
        target="_blank"
        rel="noopener noreferrer"
    >
        <span class="instagram-icon"></span>
        @thivainoax
    </a>

    <button
        id="celebrate"
        type="button"
    >
        <span class="button-inner">
            <span class="button-emoji">🎉</span>
            <span id="buttonText">
                Tap to Celebrate
            </span>
        </span>
    </button>

    <div class="footer">
        Made with ✨ for your birthday
    </div>

</main>


<script>
"use strict";

/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

function createAudioContext() {

    if (audioContext) {
        return audioContext;
    }

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) {
        return null;
    }

    audioContext = new AudioContext();

    return audioContext;
}


/*
   Frequencies for Happy Birthday.
*/

const notes = {
    G4: 392.00,
    A4: 440.00,
    B4: 493.88,
    C5: 523.25,
    D5: 587.33,
    E5: 659.25,
    F5: 698.46,
    G5: 783.99
};


/*
   Melody.
*/

const melody = [
    ["G4", .30],
    ["G4", .30],
    ["A4", .55],
    ["G4", .55],
    ["C5", .55],
    ["B4", .85],

    ["G4", .30],
    ["G4", .30],
    ["A4", .55],
    ["G4", .55],
    ["D5", .55],
    ["C5", .85],

    ["G4", .30],
    ["G4", .30],
    ["G5", .55],
    ["E5", .55],
    ["C5", .55],
    ["B4", .55],
    ["A4", .85],

    ["F5", .30],
    ["F5", .30],
    ["E5", .55],
    ["C5", .55],
    ["D5", .55],
    ["C5", 1.0]
];


function playNote(
    context,
    frequency,
    start,
    duration
) {

    const oscillator =
        context.createOscillator();

    const gain =
        context.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        frequency,
        start
    );

    /*
       Very gentle volume envelope.
    */

    gain.gain.setValueAtTime(
        0.0001,
        start
    );

    gain.gain.linearRampToValueAtTime(
        0.10,
        start + 0.025
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        start + duration
    );

    oscillator.connect(gain);
    gain.connect(context.destination);

    oscillator.start(start);

    oscillator.stop(
        start + duration + 0.05
    );
}


async function playBirthdaySong() {

    const context =
        createAudioContext();

    if (!context) {
        return;
    }

    try {

        /*
          iOS Safari requires AudioContext to be resumed
          after a user interaction.
        */

        if (context.state !== "running") {
            await context.resume();
        }

    } catch (error) {

        console.log(
            "Audio resume error:",
            error
        );

        return;
    }

    let time =
        context.currentTime + 0.03;

    for (const item of melody) {

        const note = item[0];
        const duration = item[1];

        playNote(
            context,
            notes[note],
            time,
            duration * 0.88
        );

        time += duration;
    }
}


/* =========================================================
   CONFETTI
========================================================= */

const canvas =
    document.getElementById("confetti");

const ctx =
    canvas.getContext("2d");

let particles = [];

let animationId = null;


function resizeCanvas() {

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.floor(
            window.innerWidth * ratio
        );

    canvas.height =
        Math.floor(
            window.innerHeight * ratio
        );

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas,
    { passive: true }
);


function random(min, max) {
    return Math.random() *
        (max - min) + min;
}


function createParticle(x, y) {

    const colors = [
        "#ff4d8d",
        "#ffd34d",
        "#5ee7ff",
        "#8cff9a",
        "#b78cff",
        "#ffffff",
        "#ff895e"
    ];

    return {

        x: x,
        y: y,

        vx: random(-12, 12),
        vy: random(-17, -7),

        width: random(5, 10),
        height: random(8, 16),

        rotation:
            random(0, Math.PI * 2),

        rotationSpeed:
            random(-0.25, 0.25),

        gravity:
            random(.25, .48),

        drag: .985,

        life: 0,

        maxLife:
            random(90, 160),

        opacity: 1,

        color:
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ]
    };
}


function launchConfetti() {

    const centerX =
        window.innerWidth / 2;

    const centerY =
        window.innerHeight * .62;


    /*
       Main burst.
    */

    for (let i = 0; i < 170; i++) {

        particles.push(
            createParticle(
                centerX + random(-20, 20),
                centerY + random(-10, 10)
            )
        );
    }


    /*
       Side bursts.
    */

    for (let i = 0; i < 40; i++) {

        particles.push(
            createParticle(
                window.innerWidth * .10,
                centerY
            )
        );

        particles.push(
            createParticle(
                window.innerWidth * .90,
                centerY
            )
        );
    }


    if (!animationId) {
        animateConfetti();
    }
}


function animateConfetti() {

    animationId =
        requestAnimationFrame(
            animateConfetti
        );

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.life++;

        p.vx *= p.drag;

        p.vy += p.gravity;

        p.x += p.vx;
        p.y += p.vy;

        p.rotation +=
            p.rotationSpeed;


        if (
            p.life >
            p.maxLife * .70
        ) {

            p.opacity -= .035;
        }


        ctx.save();

        ctx.translate(
            p.x,
            p.y
        );

        ctx.rotate(
            p.rotation
        );

        ctx.globalAlpha =
            Math.max(
                0,
                p.opacity
            );

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            -p.width / 2,
            -p.height / 2,
            p.width,
            p.height
        );

        ctx.restore();


        if (
            p.life >= p.maxLife ||
            p.y >
                window.innerHeight + 60 ||
            p.opacity <= 0
        ) {

            particles.splice(i, 1);
        }
    }


    if (particles.length === 0) {

        cancelAnimationFrame(
            animationId
        );

        animationId = null;
    }
}


/* =========================================================
   BUTTON
========================================================= */

const button =
    document.getElementById(
        "celebrate"
    );

const buttonText =
    document.getElementById(
        "buttonText"
    );


let alreadyCelebrated = false;


/*
   Use BOTH pointer and click compatibility.

   pointerup works well on modern iOS/Android.
   click is kept as a fallback.
*/

let lastInteraction = 0;


async function celebrate(event) {

    /*
       Prevent duplicate firing when a browser generates
       both pointerup and click.
    */

    const now =
        Date.now();

    if (
        now - lastInteraction < 500
    ) {
        return;
    }

    lastInteraction = now;


    /*
       CONFETTI FIRST.

       This means the visual celebration happens even
       if a browser blocks audio.
    */

    launchConfetti();


    /*
       Audio starts directly from the user gesture.
    */

    playBirthdaySong();


    /*
       Button feedback.
    */

    if (!alreadyCelebrated) {

        alreadyCelebrated = true;

        buttonText.textContent =
            "Happy Birthday, Thivain! 🎂";

        setTimeout(
            function () {

                buttonText.textContent =
                    "Tap to Celebrate";

                alreadyCelebrated = false;

            },
            5000
        );
    }
}


/*
   pointerup is ideal for touch devices.
*/

if ("PointerEvent" in window) {

    button.addEventListener(
        "pointerup",
        celebrate,
        { passive: true }
    );

} else {

    /*
       Older browser fallback.
    */

    button.addEventListener(
        "touchend",
        celebrate,
        { passive: true }
    );

}


/*
   Mouse / click fallback.

   We only use it on browsers without PointerEvent
   to prevent duplicate celebration.
*/

if (!("PointerEvent" in window)) {

    button.addEventListener(
        "click",
        celebrate,
        { passive: true }
    );
}


/* =========================================================
   EXTRA SAFETY
========================================================= */

/*
   If the page is opened from a local file, some browsers
   may behave differently with audio. The button still
   triggers the confetti regardless.
*/

window.addEventListener(
    "pageshow",
    function () {

        resizeCanvas();

    }
);

</script>

</body>
</html>
